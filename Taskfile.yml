# Команды проекта: https://taskfile.dev  (установка: winget install Task.Task)
version: '3'

vars:
  DEV: docker compose run --rm dev

tasks:
  default:
    silent: true
    cmds:
      - task --list

  test:
    desc: Тесты (с детектором гонок)
    cmds:
      - '{{.DEV}} go test -race ./...'

  cover:
    desc: Покрытие кода тестами
    cmds:
      - '{{.DEV}} sh -c "go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1"'

  lint:
    desc: Линтер
    cmds:
      - docker compose run --rm lint golangci-lint run ./...

  check:
    desc: Линтер + тесты — перед коммитом
    cmds:
      - task: lint
      - task: test

  run:
    desc: 'Запустить парсер в Docker; аргументы после --, например: task run -- -limit 100'
    cmds:
      - docker compose run --rm parser {{.CLI_ARGS}}

  build:
    desc: Собрать бинарники для Linux и Windows в bin/
    cmds:
      - >-
        {{.DEV}} sh -c "
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/webparser ./cmd/webparser &&
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/webparser.exe ./cmd/webparser"
